name: Build IPTV Player Firestick & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Fire TV Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Universal Fire TV APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          find app/build/outputs/apk -name "*.apk" -exec ls -la {} +
          cp app/build/outputs/apk/debug/app-debug.apk output/IPTVPlayer-FireTV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-FireTV-APK
          path: output/IPTVPlayer-FireTV.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: IPTV Player Firestick TV & Android App v1.0.0
          body: |
            ## 🚀 IPTV Player for Firestick & Android TV
            
            Universal APK package with v1 & v2 signatures for all Amazon Fire TV devices (Fire OS 5, 6, 7, 8) and Android TVs.
            
            ### 📥 Installation on Firestick:
            1. Open the **Downloader** app on Fire TV.
            2. Enter your direct download URL or Downloader short code.
            3. Tap **Install** and enjoy!
          draft: false
          prerelease: false
          files: output/IPTVPlayer-FireTV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
