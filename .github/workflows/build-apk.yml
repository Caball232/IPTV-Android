name: Build StreamVault Firestick & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Fire TV Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename & Prepare APK Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release-unsigned.apk output/StreamVault-FireTV.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/app-release.apk output/StreamVault-FireTV.apk 2>/dev/null || \
          cp app/build/outputs/apk/debug/app-debug.apk output/StreamVault-FireTV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-FireTV-APK
          path: output/StreamVault-FireTV.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: StreamVault Firestick TV & Android App v1.0.0
          body: |
            ## 🚀 StreamVault for Firestick & Android TV
            
            Universal APK package optimized for Amazon Fire TV Sticks, Fire TV Cubes, and Android devices.
            
            ### 📥 Installation on Firestick:
            1. Open the **Downloader** app on Fire TV.
            2. Enter your direct download URL or Downloader short code.
            3. Tap **Install** and enjoy!
          draft: false
          prerelease: false
          files: output/StreamVault-FireTV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
